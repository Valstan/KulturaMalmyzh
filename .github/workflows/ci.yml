name: CI

# Гейты проекта (сканер секретов + lint + typecheck + миграции + сид + build) гоняются
# здесь, на раннере GitHub, а не на машине разработчика: `pnpm build` требует живой
# Postgres (Payload читает БД на пререндере), и держать его локально ради каждого PR
# не нужно — тут БД эфемерная. Сборка прод-артефакта живёт отдельно, в deploy-prod.yml.
#
# Порядок шагов неслучаен: дешёвые проверки впереди (сканер за секунды, lint/typecheck
# без БД), дорогие — за ними. Схема БД приезжает миграцией, а не автосинхро, и по ней
# прогоняется сид с созданием И обновлением документа: только так гейт видит миграцию,
# ломающую прод-схему.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    # 30, а не 20: к сборке добавились установка chromium и прогон e2e.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dkmalmyzh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: web

    env:
      # Эфемерная БД CI. Схему даёт МИГРАЦИЯ, а не автосинхро: с push:true гейт
      # проверял автосинхронизацию по конфигу, а миграция, ломающая прод-схему,
      # проходила зелёной. Выключение push здесь — половина смысла этого job'а.
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/dkmalmyzh_ci
      PAYLOAD_DB_PUSH: 'false'
      PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3005

    steps:
      - uses: actions/checkout@v5
        with:
          # Сканер секретов смотрит всю историю, а не последний коммит: без
          # fetch-depth: 0 гейт зелен ровно в том сценарии, ради которого ставится.
          fetch-depth: 0

      # Сканер секретов (мандат Мозга 2026-08-17, D-030). Шагом внутри `gates`, а не
      # отдельным workflow: `gates` — уже обязательная проверка `main`, поэтому находка
      # блокирует влитие на сервере с первого же дня, без правки настроек защиты.
      # Стоит до установки зависимостей: падать надо за секунды, а не за двадцать минут.
      # Бинарь с явными флагами вместо gitleaks-action — три обязательных свойства
      # (полная история, --redact, ненулевой exit) видны в файле, а не в умолчаниях обёртки.
      - name: Secret scan (gitleaks)
        working-directory: ${{ github.workspace }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1
          rm -f gitleaks

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate importmap + types
        run: |
          pnpm generate:importmap
          pnpm generate:types

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Юниты — чистая логика без БД и браузера (URL сайта, slug, серверный authz,
      # ретрай чтения). Стоят здесь, до подъёма схемы и сборки: шаг за секунду,
      # и падать на нём дешевле, чем на build через десять минут. Всё, что требует
      # живой базы, проверяет сид ниже; страницы в браузере — отдельный e2e-шаг.
      - name: Unit-тесты
        run: pnpm test:unit

      # Накатываем именно `.sql` и именно через psql — тем же путём, каким миграция
      # приезжает на прод (apply-migration.yml). `.sql` извлекается из `up()` руками,
      # и расходится с ним молча: у соседа ручная зеркальная миграция потеряла
      # `version_*`-колонки, и 29 запросов легли уже в проде (G231). Гейт, гоняющий
      # `payload migrate` по `.ts`, проверял бы артефакт, которого на проде нет.
      - name: Накатить миграции (прод-путь, psql -f)
        run: |
          set -euo pipefail
          shopt -s nullglob
          COUNT=0
          for f in src/migrations/*.sql; do
            NAME=$(basename "$f" .sql)
            echo "── $NAME"
            psql "$DATABASE_URI" -v ON_ERROR_STOP=1 -q -f "$f"
            psql "$DATABASE_URI" -q -c "INSERT INTO payload_migrations (name, batch) VALUES ('$NAME', 1);"
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::в src/migrations нет ни одного .sql — накатывать нечего, гейт бессмысленен"
            exit 1
          fi
          ROWS=$(psql "$DATABASE_URI" -tAc "SELECT count(*) FROM payload_migrations;")
          echo "накачено миграций: $COUNT, записей в реестре: $ROWS"
          [ "$COUNT" = "$ROWS" ] || { echo "::error::реестр не сошёлся с числом накаченных миграций"; exit 1; }

      # Расхождение «файл миграции есть, а в реестре нет» — признак того, что
      # прод-путь неполон.
      #
      # ⚠️ `payload migrate:status` для этого НЕ годится: он печатает таблицу и
      # выходит с нулём даже когда у всех миграций стоит «Ran: No». Шаг с ним
      # выглядел проверкой, не будучи ею. Сверяем сами и падаем на расхождении.
      #
      # Сверяются три множества: .ts-миграции (то, что сгенерировал Payload),
      # .sql (то, что реально едет на прод) и реестр в БД. Забытый .sql — самая
      # частая ошибка этого проекта, и она видна только в этом сравнении.
      # ⚠️ Кавычки обязательны: второе двоеточие в значении `name:` делает
      # workflow невалидным молча (G296) — PR зелёный, а прогон падает без лога.
      - name: 'Миграции: файлы и реестр сходятся'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          TS=$(ls -1 src/migrations/*.ts 2>/dev/null | grep -v '/index\.ts$' | xargs -r -n1 basename | sed 's/\.ts$//' | sort)
          SQL=$(ls -1 src/migrations/*.sql 2>/dev/null | xargs -r -n1 basename | sed 's/\.sql$//' | sort)
          DB=$(psql "$DATABASE_URI" -tAc "SELECT name FROM payload_migrations ORDER BY name;" | sed '/^$/d' | sort)
          echo "ts: $(echo "$TS" | grep -c . || true), sql: $(echo "$SQL" | grep -c . || true), реестр: $(echo "$DB" | grep -c . || true)"
          fail=0
          diff <(echo "$TS") <(echo "$SQL") > /dev/null || {
            echo "::error::.ts и .sql миграции не совпадают — извлечённый SQL забыт или лишний"
            diff <(echo "$TS") <(echo "$SQL") || true
            fail=1
          }
          diff <(echo "$SQL") <(echo "$DB") > /dev/null || {
            echo "::error::накаченные миграции не совпадают с файлами .sql"
            diff <(echo "$SQL") <(echo "$DB") || true
            fail=1
          }
          exit $fail

      # Сид: создание И обновление существующего документа. Зелёный импорт доказывает
      # только полноту пути СОЗДАНИЯ — обновление ходит по другим таблицам (G231).
      # Заодно пререндер перестаёт собираться на пустой БД (класс G230).
      - name: Сид минимального контента
        timeout-minutes: 5
        run: pnpm payload run scripts/seed-ci.ts

      # Каталог домов культуры района: заводится и перезаводится на живой БД.
      # Проверяются идемпотентность, черновой статус, сохранность правок
      # редактора и то, что служебные заметки сборщика не утекают в публичное
      # описание (эта ошибка уже была допущена — тест держит границу).
      - name: Проверка каталога учреждений
        timeout-minutes: 5
        run: pnpm payload run scripts/seed-institutions-selftest.ts

      # Импорт из ВК на подставных записях: без токена и без сети, но на живой БД
      # после накатанной миграции. Проверяется идемпотентность — таймер на боксе
      # ходит по одним и тем же стенам каждые полчаса, и импорт, создающий дубли
      # на втором заходе, забьёт ленту района за сутки. Свойство держится на
      # уникальном `vkUid`, то есть на схеме: юнитом его не проверить.
      - name: Проверка импорта из ВК
        timeout-minutes: 5
        run: pnpm payload run scripts/vk-sync-selftest.ts

      # Перенос Калинино (D-074) на выгрузке той же формы, что на боксе: поля
      # videos/sourceUrl не теряются, slug и публикация владельца сохраняются,
      # повтор не плодит записей и медиа, коллизия адреса останавливает боевой
      # прогон до первой записи. Схема тут новая (таблица posts_videos,
      # колонка source_url) — юнитом это не проверить.
      - name: Проверка переноса Калинино
        timeout-minutes: 5
        run: pnpm payload run scripts/kalinino-transfer-selftest.ts

      - name: Build
        run: pnpm build

      # Единственный шаг, который открывает страницы в настоящем браузере.
      # Зачем он нужен поверх сборки и сида: динамические маршруты (/news/[slug],
      # /pages/[slug]) остаются `ƒ` и в пререндер не попадают — ошибку рендера
      # конкретного документа сборка не видит, а сид ходит мимо React вовсе.
      # Ставим последним: браузер качается полминуты, а падать раньше должны
      # проверки подешевле.
      - name: Поставить браузер
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E-smoke (прод-сборка в браузере)
        run: pnpm test:e2e

      # Проверка массовой публикации — ПОСЛЕ e2e, а не до сборки: операция
      # публикует ВСЕ черновики в базе, включая засеянные сидом специально для
      # негативных e2e-проверок (черновик обязан давать 404). Раньше — и e2e
      # покраснеет не по своей вине.
      - name: Проверка массовой публикации
        timeout-minutes: 5
        run: pnpm payload run scripts/publish-all-selftest.ts

      # Лента: страницы по 20, порядок по дате, раздел отдаёт только свои
      # записи, черновик не отдаётся. Свой дом культуры с известным числом
      # записей — иначе счётчики зависят от сида и проверка ничего не значит.
      - name: Проверка ленты
        timeout-minutes: 5
        run: pnpm payload run scripts/feed-selftest.ts

      # Поиск по ленте (вскрытие 08.10: 842 новости были неискаемы). Регистр
      # кириллицы и экранирование `%` проверяются фактом на живой базе, а не
      # по документации адаптера: локаль продовой базы могла бы их и не дать.
      - name: Проверка поиска по ленте
        timeout-minutes: 5
        run: pnpm payload run scripts/feed-search-selftest.ts

      # Чистка дублей: свойства держатся на удалении, юнитами не увидеть.
      # Главное свойство — НЕ удалять чужое: одинаковый заголовок с разным
      # текстом и перепосты без текста обязаны остаться.
      - name: Проверка чистки дублей
        timeout-minutes: 5
        run: pnpm payload run scripts/dedupe-selftest.ts

      # Афиши и пустые записи без текста (заказ владельца 02.10): свойства
      # держатся на записи и удалении, юнитами не увидеть. Главное свойство —
      # НЕ трогать чужое: альбомы, видео, посты с текстом и обычные заголовки
      # остаются; одно фото без текста переименовывается в «Афиша от …»,
      # пустое без фото удаляется.
      - name: Проверка афиш и пустых записей
        timeout-minutes: 5
        run: pnpm payload run scripts/posters-selftest.ts

      # Отчёт нужен только когда что-то легло: по нему видно, на каком шаге и с
      # каким DOM. При зелёном прогоне артефакт не создаётся.
      - name: Отчёт playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
