# Настройки pnpm живут здесь, а не в поле `pnpm` package.json.
#
# С pnpm 10 поле `pnpm` в package.json больше НЕ читается — pnpm печатает
# «The "pnpm" field in package.json is no longer read by pnpm» и молча игнорирует
# его содержимое. Нашёно при разборе аудита зависимостей 29.10: переопределения
# fast-uri / js-yaml / immutable / postcss из package.json при pnpm 10.15.0 (он же
# в CI через corepack) не применялись. Лечится переносом настроек сюда.
#
# Overrides — правка транзитивных зависимостей по advisory. НЕ `pnpm audit fix
# --omit=dev`: он выносит devDependencies из дерева, и следующий tsc «пропадает»
# (G385). Порог гейта — high: critical/high чиним, moderate/low читаем.
packages:
  - '.'

overrides:
  # --- advisory октября 2026 (critical+high в prod-дереве → 0) ---
  dompurify: ^3.4.17 # через monaco-editor (редактор админки Payload)
  graphql-scalars: ^2.0.1 # через @payloadcms/graphql (плагин GraphQL у нас не включён)
  happy-dom: ^21.0.4 # через @lexical/headless (withDOM — разбор HTML на сервере)
  nodemailer: ^10.0.6 # через @payloadcms/email-nodemailer (адаптер SMTP)
  source-map-js: ^1.2.2 # транзитив @payloadcms/next
  undici: ^7.30.1 # через payload

  # --- из прошлых правок, перенесено из package.json как было ---
  fast-uri: ^3.1.9
  immutable: ^4.3.9
  js-yaml@>=4: ^4.3.2
  postcss@>=8: ^8.5.18

# Скрипты установки этих пакетов — проверочные no-op (у sharp install-скрипта нет
# вовсе, бинарники приезжают платформенными optional-зависимостями), но pnpm 10
# по умолчанию их блокирует. Раньше список жил в игнорируемом поле package.json и
# тоже не действовал.
onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver
